name: Publish site

# Every change to main (panel saves, merged pull requests) rebuilds and publishes the site,
# adding the automatic translations and publication keywords (tools/publish.sh).
# The hourly run retries anything that could not be translated yet.
# If a run fails, an issue is opened in the repository (GitHub e-mails it); the next good run closes it.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build site with translations and keywords
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: bash tools/publish.sh

      - if: steps.build.outputs.publish == 'true'
        uses: actions/configure-pages@v6

      - if: steps.build.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or close the "publish failed" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ needs.build.result == 'failure' || needs.deploy.result == 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="La publicación de la web ha fallado"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "$FAILED" = true ]; then
            if [ -z "$open" ]; then
              gh issue create --title "$title" --assignee JvRtX --body "La ejecución $RUN_URL del proceso «Publish site» ha fallado. La web sigue mostrando la última versión publicada. Abre la ejecución, mira el paso en rojo y usa «Re-run jobs». Este aviso se cierra solo cuando una ejecución posterior publique bien."
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Resuelto: $RUN_URL ha publicado la web correctamente."
          fi
