name: Publish site

# Every change to main (panel saves, merged pull requests) rebuilds and publishes the site,
# adding the automatic translations and publication keywords (tools/publish.sh).
# The hourly run retries anything that could not be translated yet.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site with translations and keywords
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: bash tools/publish.sh

      - if: steps.build.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - if: steps.build.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
